name: Build FreeDM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FreeDM.csproj

      - name: Build
        run: dotnet build FreeDM.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish FreeDM.csproj --configuration Release --output ./publish --no-restore

      - name: Upload FreeDM
        uses: actions/upload-artifact@v4
        with:
          name: FreeDM
          path: ./publish
